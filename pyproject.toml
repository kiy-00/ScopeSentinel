[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
authors = [
    { name = "Chengyu Wang" },
    { name = "Chengrui Zhang" },
]
name = "scopesentinel"
version = "0.0.0"
description = "Runtime scope enforcement and attack defense for autonomous web agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["web-agent", "security", "prompt-injection", "llm", "browser-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

lint = [
    "ruff>=0.5.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/kiy-00/ScopeSentinel"
Issues = "https://github.com/kiy-00/ScopeSentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ScopeSentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ScopeSentinel"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]


[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict = false